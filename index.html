<!doctype html>
<meta charset="utf-8">
<title>SCTM-2005</title>
<h1>SCTM-2005</h1>
<div id="out">Loading...</div>
<script>
var n = (a, b) => a.localeCompare(b, undefined, {numeric: true});
var user = location.hostname.split('.')[0], repo = location.pathname.split('/')[1];
function load(branch) {
  return fetch('https://api.github.com/repos/' + user + '/' + repo + '/git/trees/' + branch + '?recursive=1')
    .then(r => r.json())
    .then(d => { if (!d.tree) throw 0; return d.tree; });
}
load('main').catch(() => load('master')).then(tree => {
  var dirs = {};
  tree.forEach(f => {
    if (f.type != 'blob' || f.path == 'index.html' || f.path[0] == '.') return;
    var i = f.path.lastIndexOf('/'), k = i < 0 ? '/' : f.path.slice(0, i);
    (dirs[k] = dirs[k] || []).push(f.path);
  });
  out.innerHTML = Object.keys(dirs).sort(n).map(k =>
    '<h3>' + k + '</h3><ul>' + dirs[k].sort(n).map(p =>
      '<li><a href="' + p + '">' + p.split('/').pop() + '</a></li>').join('') + '</ul>').join('');
}).catch(() => {
  out.innerHTML = 'Could not load the file list. This page only works when opened from GitHub Pages (https://YOUR-USERNAME.github.io/REPO-NAME/), not from a file on your computer.';
});
</script>
